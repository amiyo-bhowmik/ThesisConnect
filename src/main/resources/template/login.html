<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thesis Connect - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <h1>Thesis Connect</h1>
                <p>Login to your account</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn-login">Login</button>
            </form>
            
            <div id="message" class="message"></div>
            
            <div class="register-link">
                <p>Don't have an account? <a href="#" onclick="showRegister()">Register here</a></p>
            </div>
        </div>
        
        <div class="register-container" style="display: none;">
            <div class="login-header">
                <h1>Thesis Connect</h1>
                <p>Create a new account</p>
            </div>
            
            <form id="registerForm" class="login-form">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="regDepartment">Department</label>
                    <input type="text" id="regDepartment" name="department">
                </div>
                
                <div class="form-group">
                    <label for="regUniversity">University</label>
                    <input type="text" id="regUniversity" name="university">
                </div>
                
                <button type="submit" class="btn-login">Register</button>
            </form>
            
            <div id="regMessage" class="message"></div>
            
            <div class="register-link">
                <p>Already have an account? <a href="#" onclick="showLogin()">Login here</a></p>
            </div>
        </div>
    </div>
    
    <!-- <script src="/js/auth.js"></script> -->
    
</body>
</html>
